# /etc/nginx/sites-enabled/bziger.com
#
# Static only. The build writes n/<slug>/index.html, so `try_files` resolves
# clean URLs without a redirect.

server {
    listen 443 ssl;
    server_name bziger.com;

    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    root /srv/blog;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Content is immutable per deploy; the HTML is not.
    location ~* \.(css|js|woff2?|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Semantic search is the only part that needs a process. It stays off the
    # box until the Chroma index is built; until then /api returns 404.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8001;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

server {
    listen 80;
    server_name bziger.com;
    return 301 https://$host$request_uri;
}
